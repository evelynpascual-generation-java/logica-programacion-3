<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Factoriales</title>
</head>

<body>
    <main>
        <header>
            <h1>Calculadora de Factoriales</h1>
        </header>
        <section class="value-card">
            <label for="value">Ingrese un entero y positivo:</label>
            <div class="input-group">
                <input type="text" id="value" name="temperatura" placeholder="Ej. 8" />
                <button id="btn">Calcular</button>
            </div>
        </section>


        <section id="output-card" class="result-card">
        </section>

    </main>
    <script src="script.js"></script>
</body>

</html>
